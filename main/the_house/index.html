    </nav>
  </header>
  <main id="main">
    <div id="first">
      <div class="container">
        <div class="text-holder">
          <label>
            <input type="range" min="6" max="20" step="0.1" id="fontSize">
          </label>

          <label>
            <input type="range" min="-0.1" max="0.5" step="0.01" id="letterSpacing">
          </label>
          <h1>
            The House
          </h1>
          <textarea spellcheck="false" class="headline-input">You can type...</textarea>
        </div>
      </div>
    </div>
  </main>
  <script>
    const root = document.documentElement;

    fontSize.addEventListener("input", e => {
      root.style.setProperty("--font-size", `${e.target.value}em`);
    });

    letterSpacing.addEventListener("input", e => {
      root.style.setProperty("--letter-spacing", `${e.target.value}em`);
    });
  </script>
